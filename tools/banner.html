<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0d1117; }
  .wrap { width:1200px; font-family:'Fira Code','DejaVu Sans Mono',monospace; }

  .hero {
    position:relative; height:340px; border-radius:14px; overflow:hidden;
    background:
      radial-gradient(120% 140% at 12% 30%, rgba(0,220,80,0.16) 0%, rgba(0,0,0,0) 45%),
      radial-gradient(120% 140% at 95% 90%, rgba(255,140,0,0.14) 0%, rgba(0,0,0,0) 50%),
      linear-gradient(135deg, #04160b 0%, #05100a 55%, #120a02 100%);
    border:1px solid rgba(0,255,100,0.25);
    display:flex; align-items:center; padding:0 56px;
  }
  .hero::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,255,120,0.035) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .ghost { position:relative; width:230px; height:230px; flex:none; margin-right:20px; }
  .badge-v {
    position:absolute; top:22px; right:26px;
    font-size:15px; font-weight:700; color:#39ff9e;
    border:1px solid #39ff9e; border-radius:7px; padding:5px 12px; letter-spacing:1px;
    box-shadow:0 0 14px rgba(57,255,158,0.35);
  }
  .content { position:relative; z-index:2; }
  .wordmark { font-size:82px; font-weight:800; line-height:0.95; letter-spacing:-2px; }
  .wordmark .ghost-t { color:#2fff6a; text-shadow:0 0 22px rgba(47,255,106,0.55); }
  .wordmark .buster-t { color:#ff9b2e; text-shadow:0 0 22px rgba(255,155,46,0.5); }
  .cmd { margin-top:18px; font-size:23px; font-weight:700; color:#3fe06a; }
  .cmd .p { color:#4fd0ff; } .cmd .f { color:#ffcf4d; }
  .subtitle { margin-top:14px; font-size:16px; color:#c8d2cc; font-weight:400; letter-spacing:0.3px; }
  .tags { margin-top:20px; display:flex; gap:12px; }
  .tag { font-size:13px; font-weight:700; letter-spacing:0.6px; padding:6px 15px; border-radius:20px; border:1.5px solid; }
  .t-red{color:#ff5b6e;border-color:#ff5b6e;} .t-grn{color:#2fff6a;border-color:#2fff6a;}
  .t-cyan{color:#4fd0ff;border-color:#4fd0ff;} .t-org{color:#ff9b2e;border-color:#ff9b2e;}
  .badges { display:flex; gap:10px; margin-top:16px; padding:0 4px; }
  .b { display:flex; font-size:13px; font-weight:700; border-radius:5px; overflow:hidden; }
  .b .k { background:#3a4048; color:#e6edf3; padding:6px 10px; }
  .b .v { padding:6px 10px; color:#0d1117; }
  .v-grn{background:#2fdd6a;} .v-blue{background:#4fb3ff;color:#04121f;}
  .v-cyan{background:#3ad6c8;} .v-red{background:#ff5b6e;color:#fff;}
  .v-org{background:#ff9b2e;} .v-purp{background:#b18cff;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="badge-v">v1.1.0</div>
    <svg class="ghost" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gbody" cx="42%" cy="34%" r="75%">
          <stop offset="0%" stop-color="#5bff9a"/>
          <stop offset="55%" stop-color="#20e070"/>
          <stop offset="100%" stop-color="#12b84a"/>
        </radialGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="3.5"/></filter>
      </defs>
      <path d="M120 26 C 70 26, 40 64, 40 112 L 40 196 C 40 206, 52 210, 58 202
               L 70 186 L 84 204 C 88 210, 96 210, 100 204 L 112 188 L 124 204
               C 128 210, 136 210, 140 204 L 152 186 L 164 202 C 170 210, 182 206, 182 196
               L 182 112 C 182 64, 170 26, 120 26 Z"
            fill="url(#gbody)" stroke="#0b3d20" stroke-width="3"/>
      <ellipse cx="98" cy="104" rx="15" ry="19" fill="#ffffff"/>
      <ellipse cx="146" cy="104" rx="15" ry="19" fill="#ffffff"/>
      <circle cx="102" cy="108" r="7.5" fill="#07110b"/>
      <circle cx="150" cy="108" r="7.5" fill="#07110b"/>
      <path d="M96 140 Q120 162 148 140" stroke="#07110b" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g stroke="#ff9b2e" stroke-width="7" fill="none" filter="url(#glow)">
        <circle cx="196" cy="150" r="26"/>
        <line x1="214" y1="170" x2="236" y2="196" stroke-linecap="round"/>
      </g>
      <circle cx="196" cy="150" r="26" fill="rgba(255,207,77,0.12)"/>
    </svg>
    <div class="content">
      <div class="wordmark"><span class="ghost-t">ghost</span><span class="buster-t">buster</span></div>
      <div class="cmd">$ ghostbuster <span class="p">+91XXXXXXXXXX</span> <span class="f">--deep</span></div>
      <div class="subtitle">OSINT Reconnaissance Framework &middot; 7 intel modules &middot; MNP-aware phone intel &middot; honest by design</div>
      <div class="tags">
        <span class="tag t-red">RED TEAM</span>
        <span class="tag t-grn">Python</span>
        <span class="tag t-cyan">async</span>
        <span class="tag t-org">Veriphone &middot; Shodan &middot; HIBP</span>
      </div>
    </div>
  </div>
  <div class="badges">
    <div class="b"><span class="k">status</span><span class="v v-grn">active</span></div>
    <div class="b"><span class="k">license</span><span class="v v-blue">MIT</span></div>
    <div class="b"><span class="k">python</span><span class="v v-blue">3.9+</span></div>
    <div class="b"><span class="k">modules</span><span class="v v-cyan">7</span></div>
    <div class="b"><span class="k">phone dorks</span><span class="v v-red">20</span></div>
    <div class="b"><span class="k">providers</span><span class="v v-org">7</span></div>
    <div class="b"><span class="k">platform</span><span class="v v-purp">Kali &middot; Termux</span></div>
  </div>
</div>
</body>
</html>
