<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostBuster Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%231a1a1a" width="100" height="100"/><circle cx="10" cy="10" r="1" fill="%23222"/><circle cx="30" cy="20" r="1" fill="%23222"/><circle cx="50" cy="15" r="1" fill="%23222"/><circle cx="70" cy="25" r="1" fill="%23222"/></svg>');
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .banner-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(20,20,40,0.8) 100%);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3), 0 0 60px rgba(255, 140, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .main-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .ghost-text {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8), 0 0 20px rgba(0, 255, 0, 0.4);
            color: #00ff00;
            font-style: italic;
            animation: glow-green 2s ease-in-out infinite;
        }

        .buster-text {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.8), 0 0 20px rgba(255, 140, 0, 0.4);
            color: #ff8c00;
            font-style: italic;
            animation: glow-orange 2s ease-in-out infinite;
        }

        .tagline {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border-top: 1px solid rgba(0, 255, 0, 0.3);
            border-bottom: 1px solid rgba(255, 140, 0, 0.3);
        }

        .tagline-text {
            font-size: 1.2rem;
            color: #00ff00;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .details {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .detail-item {
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-item::before {
            content: "▶";
            color: #ff8c00;
        }

        .version-badge {
            background: linear-gradient(135deg, #00ff00, #ff8c00);
            color: #000;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .ghost-icon {
            font-size: 3rem;
            margin: 0 10px;
            animation: float 3s ease-in-out infinite;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ff8c00;
            text-shadow: 0 0 5px rgba(255, 140, 0, 0.5);
            border-top: 1px solid rgba(255, 140, 0, 0.3);
            padding-top: 15px;
        }

        .footer-text em {
            color: #00ff00;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        @keyframes glow-green {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 255, 0, 0.8), 0 0 20px rgba(0, 255, 0, 0.4);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 0, 1), 0 0 40px rgba(0, 255, 0, 0.6);
            }
        }

        @keyframes glow-orange {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 140, 0, 0.8), 0 0 20px rgba(255, 140, 0, 0.4);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 140, 0, 1), 0 0 40px rgba(255, 140, 0, 0.6);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .decoration {
            text-align: center;
            color: #00ff00;
            margin: 10px 0;
            letter-spacing: 10px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .ghost-text, .buster-text {
                font-size: 2.5rem;
            }
            .main-title {
                flex-direction: column;
                gap: 10px;
            }
            .details {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="main-title">
            <div class="ghost-text">GHOST</div>
            <div class="ghost-icon">👻</div>
            <div class="buster-text">BUSTER</div>
        </div>

        <div class="decoration">═════════════════════════════════</div>

        <div class="tagline">
            <div class="tagline-text">OSINT Reconnaissance Framework</div>
            <div class="details">
                <div class="detail-item">Hunt Every Ghost</div>
                <div class="version-badge">v1.1.0</div>
                <div class="detail-item">Authorized Testing Only</div>
            </div>
        </div>

        <div class="decoration">═════════════════════════════════</div>

        <div class="footer-text">
            Developed by <em>Yaman.RedTeam</em> •
            <a href="https://github.com/Yaman-RedTeam/ghostbuster"
               style="color: #00ff00; text-decoration: none; text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);">
                github.com/Yaman-RedTeam/ghostbuster
            </a>
        </div>
    </div>
</body>
</html>
